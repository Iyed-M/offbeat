name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27'
          cache: true
      - name: Install media tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          ffmpeg -version
          ffprobe -version
      - name: Download modules
        run: go mod download
      - name: Check formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "Unformatted files:"
            echo "$unformatted"
            exit 1
          fi
      - name: Vet
        run: go vet ./...
      - name: Build
        run: |
          go build ./cmd/offbeat
          go build ./cmd/offbeatd
      - name: Test
        run: go test ./... -count=1
      - name: Test (race)
        run: go test ./... -race -count=1
      - name: Test Spicetify extension
        run: node --test spicetify/offbeat/offbeat.test.js

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Build, test storage, and lint
        working-directory: android
        run: ./gradlew testDebugUnitTest assembleDebug assembleDebugAndroidTest lintDebug
      - name: Verify synthetic tagged fixtures
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python3 android/scripts/verify-fixtures.py
      - uses: actions/upload-artifact@v4
        with:
          name: android-storage-proof
          path: |
            android/app/build/outputs/apk/debug/*.apk
            android/app/build/reports/tests/testDebugUnitTest/
            android/app/build/reports/lint-results-debug.html
